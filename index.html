<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>beshoy.com — Domain For Sale</title>
  <meta name="description" content="beshoy.com is available for purchase at $1,000. Contact us to acquire this premium domain." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #2a2a3a;
      --accent: #6c63ff;
      --accent-glow: rgba(108, 99, 255, 0.25);
      --text: #e8e8f0;
      --muted: #7070a0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% -10%, rgba(108, 99, 255, 0.18) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(99, 179, 255, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 3.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(108,99,255,0.08);
    }

    .badge {
      display: inline-block;
      background: rgba(108, 99, 255, 0.15);
      border: 1px solid rgba(108, 99, 255, 0.35);
      color: #a89fff;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.3rem 0.85rem;
      border-radius: 100px;
      margin-bottom: 1.75rem;
    }

    .domain {
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 30%, #a89fff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .tagline {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 2.25rem;
      line-height: 1.5;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 2rem 0;
    }

    .price-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .price {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #fff;
      line-height: 1;
      margin-bottom: 0.4rem;
    }

    .price-note {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .cta {
      display: inline-block;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 24px var(--accent-glow);
    }

    .cta:hover {
      opacity: 0.88;
      transform: translateY(-1px);
      box-shadow: 0 8px 32px var(--accent-glow);
    }

    .cta:active {
      transform: translateY(0);
    }

    .contact-info {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .contact-info a {
      color: #a89fff;
      text-decoration: none;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    .features {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .feature-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6c63ff;
      flex-shrink: 0;
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Premium Domain</div>

    <div class="domain">beshoy.com</div>
    <p class="tagline">A short, memorable .com domain — ready to power your next brand, project, or idea.</p>

    <div class="divider"></div>

    <p class="price-label">Asking Price</p>
    <div class="price">$1,000</div>
    <p class="price-note">One-time purchase &middot; Instant transfer</p>

    <a class="cta" href="mailto:info@beshoy.com?subject=Interested%20in%20beshoy.com&body=Hi%2C%0A%0AI%27m%20interested%20in%20purchasing%20beshoy.com%20for%20%241%2C000.%20Please%20let%20me%20know%20the%20next%20steps.%0A%0AThank%20you.">
      Make an Offer
    </a>

    <p class="contact-info">
      or email us directly at <a href="mailto:info@beshoy.com">info@beshoy.com</a>
    </p>

    <div class="features">
      <span class="feature"><span class="feature-dot"></span> Short &amp; memorable</span>
      <span class="feature"><span class="feature-dot"></span> .com extension</span>
      <span class="feature"><span class="feature-dot"></span> Fast transfer</span>
    </div>
  </div>
</body>
</html>
